server {
    listen 127.0.0.1:80 default_server;

    root /var/www/html;
    index index.html;

    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Strip version info
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }
}
